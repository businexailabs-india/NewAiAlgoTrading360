[project]
name = "mcp-connector-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "advisory-core",
  "mcp-connectors",
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.32.1",
  "httpx>=0.28.0",
]

[tool.uv.sources]
advisory-core = { workspace = true }
mcp-connectors = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
