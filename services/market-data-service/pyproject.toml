[project]
name = "market-data-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115.6", "uvicorn[standard]>=0.32.1", "algo-platform-store", "schemas"]

[tool.uv.sources]
algo-platform-store = { workspace = true }
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
