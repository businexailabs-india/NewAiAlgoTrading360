[project]
name = "dhanlaxmi-assistant-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.0",
  "prometheus-client>=0.21.0",
  "advisory-core",
  "language-core",
  "voice-core",
  "intent-core",
  "trade-command-parser",
  "safety-guardrails",
  "localized-response-templates",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
