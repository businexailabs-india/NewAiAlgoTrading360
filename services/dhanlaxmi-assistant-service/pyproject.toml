[project]
name = "dhanlaxmi-assistant-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.0",
  "prometheus-client>=0.21.0",
  "advisory-core",
  "language-core",
  "voice-core",
  "intent-core",
  "trade-command-parser",
  "safety-guardrails",
  "localized-response-templates",
  "llm-providers",
  "prompt-to-strategy",
  "strategy-engine",
  "schemas",
  "paper-broker",
  "market-simulator",
  "risk-rules",
  "mcp-connectors",
  "live-risk-gate",
]

[tool.uv.sources]
advisory-core = { workspace = true }
language-core = { workspace = true }
voice-core = { workspace = true }
intent-core = { workspace = true }
trade-command-parser = { workspace = true }
safety-guardrails = { workspace = true }
localized-response-templates = { workspace = true }
llm-providers = { workspace = true }
prompt-to-strategy = { workspace = true }
strategy-engine = { workspace = true }
schemas = { workspace = true }
paper-broker = { workspace = true }
market-simulator = { workspace = true }
risk-rules = { workspace = true }
mcp-connectors = { workspace = true }
live-risk-gate = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
