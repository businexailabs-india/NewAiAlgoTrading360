[project]
name = "algo-bots-service"
version = "0.1.0"
description = "HTTP API (HMAC-authenticated, RBAC-enforced) over the tradex-bots library. Paper/live gate/analytics/reports."
requires-python = ">=3.12"
dependencies = [
  "tradex-bots",
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.32.1",
  "pydantic>=2.10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.28.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = ["slow: slow tests"]
