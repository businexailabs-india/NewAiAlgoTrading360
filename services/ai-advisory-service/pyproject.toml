[project]
name = "ai-advisory-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "advisory-core",
  "mcp-connectors",
  "strategy-normalizer",
  "risk-explainability",
  "market-regime-detector",
  "llm-providers",
  "recommendation-ranking",
  "advisory-to-strategy",
  "schemas",
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.32.1",
  "alembic>=1.14.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.7.0",
]

[tool.uv.sources]
advisory-core = { workspace = true }
mcp-connectors = { workspace = true }
strategy-normalizer = { workspace = true }
risk-explainability = { workspace = true }
market-regime-detector = { workspace = true }
llm-providers = { workspace = true }
recommendation-ranking = { workspace = true }
advisory-to-strategy = { workspace = true }
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
