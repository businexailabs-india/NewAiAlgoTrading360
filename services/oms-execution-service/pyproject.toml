[project]
name = "oms-execution-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.7.0",
  "advisory-core",
  "live-risk-gate",
]

[tool.uv.sources]
advisory-core = { workspace = true }
live-risk-gate = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
