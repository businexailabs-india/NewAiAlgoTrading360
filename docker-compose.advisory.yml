# AI Algo Advisory stack — run from repo root:
# docker compose -f docker-compose.advisory.yml up -d
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: bxai-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 15s
      timeout: 10s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: bxai-redpanda-console
    depends_on:
      - redpanda
    ports:
      - "8085:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

  ai-advisory-service:
    build:
      context: .
      dockerfile: services/ai-advisory-service/Dockerfile
    container_name: bxai-ai-advisory
    ports:
      - "8091:8091"
    environment:
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET:-dev-service-hmac-secret-change-me}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      DATABASE_URL: postgresql+asyncpg://smarttrade:smarttrade_password@host.docker.internal:5432/smarttrade
      REDIS_URL: redis://host.docker.internal:6379/0
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-claude}
      FALLBACK_LLM_PROVIDER: ${FALLBACK_LLM_PROVIDER:-openrouter}
      BIFROST_ENABLED: ${BIFROST_ENABLED:-true}
      BIFROST_BASE_URL: ${BIFROST_BASE_URL:-http://host.docker.internal:8080}
      BIFROST_API_KEY: ${BIFROST_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-BusineXAi TradeOS360}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      ALLOW_MOCK_LLM: ${ALLOW_MOCK_LLM:-true}
    depends_on:
      - redpanda

  paper-test-orchestrator:
    build:
      context: .
      dockerfile: services/paper-test-orchestrator/Dockerfile
    container_name: bxai-paper-test
    ports:
      - "8092:8092"
    environment:
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET:-dev-service-hmac-secret-change-me}

  external-algo-discovery-service:
    build:
      context: .
      dockerfile: services/external-algo-discovery-service/Dockerfile
    container_name: bxai-external-algo
    ports:
      - "8093:8093"
    environment:
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET:-dev-service-hmac-secret-change-me}

  mcp-connector-service:
    build:
      context: .
      dockerfile: services/mcp-connector-service/Dockerfile
    container_name: bxai-mcp-connector
    ports:
      - "8094:8094"
    environment:
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET:-dev-service-hmac-secret-change-me}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      LIVE_TRADING_ENABLED: "false"
      PAPER_TRADING_ENABLED: "true"
      MCP_DEFAULT_PROVIDER: paper_trading
      MCP_ENABLE_DHAN: "true"
      MCP_ENABLE_ZERODHA: "false"
      MCP_ENABLE_ANGELONE: "false"
      MCP_ENABLE_UPSTOX: "false"
      MCP_ENABLE_FYERS: "false"
      MCP_ENABLE_ICICI_BREEZE: "false"
      MCP_ENABLE_KOTAK_NEO: "false"
      MCP_ENABLE_ALICE_BLUE: "false"
      MCP_ENABLE_FINVASIA_SHOONYA: "false"
      MCP_ENABLE_MOCK: "true"
      MCP_ENABLE_MOCK_MARKET_DATA: "true"
      MCP_ENABLE_IBKR: "true"
      SECRET_MANAGER_PROVIDER: local_encrypted
      LOCAL_SECRET_KEY: ${LOCAL_SECRET_KEY:-change-this-in-production}
      MCP_PROVIDERS_CONFIG_DIR: /workspace/config/mcp-providers
      DHAN_BASE_URL: ${DHAN_BASE_URL:-}
      DHAN_API_KEY: ${DHAN_API_KEY:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      IBKR_HOST: ${IBKR_HOST:-127.0.0.1}
      IBKR_PORT: ${IBKR_PORT:-7497}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1001}
      IBKR_ACCOUNT_ID: ${IBKR_ACCOUNT_ID:-}
      IBKR_MODE: ${IBKR_MODE:-paper}
      IBKR_LIVE_TRADING_ENABLED: "false"
      IBKR_USE_MOCK: "true"
      IBKR_CONNECTION_MODE: mock
      IBKR_CONNECT_TIMEOUT_SECONDS: ${IBKR_CONNECT_TIMEOUT_SECONDS:-15}
    depends_on:
      - redpanda
    volumes:
      - ./config/mcp-providers:/workspace/config/mcp-providers:ro
