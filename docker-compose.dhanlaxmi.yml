# DhanLaxmi multilingual assistant stack — from repo root:
# docker compose -f docker-compose.dhanlaxmi.yml up -d --build
services:
  dhanlaxmi-assistant-service:
    build:
      context: .
      dockerfile: services/dhanlaxmi-assistant-service/Dockerfile
    container_name: bxai-dhanlaxmi
    ports:
      - "8095:8095"
    environment:
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET:-dev-service-hmac-secret-change-me}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-claude}
      FALLBACK_LLM_PROVIDER: ${FALLBACK_LLM_PROVIDER:-openrouter}
      BIFROST_ENABLED: ${BIFROST_ENABLED:-true}
      BIFROST_BASE_URL: ${BIFROST_BASE_URL:-http://host.docker.internal:8080}
      BIFROST_API_KEY: ${BIFROST_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-BusineXAi TradeOS360}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      ALLOW_MOCK_LLM: ${ALLOW_MOCK_LLM:-true}

  voice-gateway-service:
    build:
      context: .
      dockerfile: services/voice-gateway-service/Dockerfile
    container_name: bxai-voice-gateway
    ports:
      - "8096:8096"
    environment:
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET:-dev-service-hmac-secret-change-me}
      DHANLAXMI_SERVICE_URL: http://dhanlaxmi-assistant-service:8095
      DEFAULT_STT_PROVIDER: ${DEFAULT_STT_PROVIDER:-mock}
      DEFAULT_TTS_PROVIDER: ${DEFAULT_TTS_PROVIDER:-mock}
    depends_on:
      - dhanlaxmi-assistant-service

  language-intent-service:
    build:
      context: .
      dockerfile: services/language-intent-service/Dockerfile
    container_name: bxai-language-intent
    ports:
      - "8097:8097"
    environment:
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET:-dev-service-hmac-secret-change-me}

  trade-approval-service:
    build:
      context: .
      dockerfile: services/trade-approval-service/Dockerfile
    container_name: bxai-trade-approval
    ports:
      - "8098:8098"
    environment:
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET:-dev-service-hmac-secret-change-me}
