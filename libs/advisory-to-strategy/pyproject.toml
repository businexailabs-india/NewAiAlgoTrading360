[project]
name = "advisory-to-strategy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "schemas",
  "strategy-normalizer",
  "advisory-core",
]

[tool.uv.sources]
schemas = { workspace = true }
strategy-normalizer = { workspace = true }
advisory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisory_to_strategy"]
