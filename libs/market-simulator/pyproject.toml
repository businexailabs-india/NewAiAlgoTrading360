[project]
name = "market-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["schemas", "numpy>=2.0.0", "pandas>=2.2.0"]

[tool.uv.sources]
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_simulator"]
