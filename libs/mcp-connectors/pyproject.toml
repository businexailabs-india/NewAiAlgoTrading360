[project]
name = "mcp-connectors"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "advisory-core",
  "httpx>=0.28.0",
  "pydantic>=2.10.3",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
ibkr = [
  "ibapi>=9.81.1; python_version>='3.12'",
]

[tool.uv.sources]
advisory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_connectors"]
