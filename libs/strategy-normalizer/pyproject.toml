[project]
name = "strategy-normalizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["advisory-core", "pydantic>=2.10.3"]

[tool.uv.sources]
advisory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_normalizer"]
