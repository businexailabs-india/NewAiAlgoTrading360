[project]
name = "ibkr-orb-paper"
version = "0.1.0"
description = "IBKR paper-only regime-filtered opening-range breakout (research/paper trading)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
ibkr = ["ibapi>=9.81.1"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
ibkr-orb-paper = "ibkr_orb_paper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibkr_orb_paper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
