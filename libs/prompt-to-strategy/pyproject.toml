[project]
name = "prompt-to-strategy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "schemas",
  "llm-providers",
]

[tool.uv.sources]
schemas = { workspace = true }
llm-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_to_strategy"]
