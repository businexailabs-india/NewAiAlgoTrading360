[project]
name = "strategy-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "schemas",
  "algo-templates",
  "risk-rules",
  "market-simulator",
  "paper-broker",
  "performance-metrics",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
]

[tool.uv.sources]
schemas = { workspace = true }
algo-templates = { workspace = true }
risk-rules = { workspace = true }
market-simulator = { workspace = true }
paper-broker = { workspace = true }
performance-metrics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_engine"]
