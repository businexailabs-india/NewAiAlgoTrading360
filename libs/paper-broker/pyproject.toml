[project]
name = "paper-broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["schemas", "risk-rules", "market-simulator"]

[tool.uv.sources]
schemas = { workspace = true }
risk-rules = { workspace = true }
market-simulator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_broker"]
