[project]
name = "algo-platform-store"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "schemas",
  "algo-templates",
  "strategy-engine",
  "paper-broker",
  "risk-rules",
  "market-simulator",
  "performance-metrics",
  "sqlalchemy>=2.0.36",
]

[tool.uv.sources]
schemas = { workspace = true }
algo-templates = { workspace = true }
strategy-engine = { workspace = true }
paper-broker = { workspace = true }
risk-rules = { workspace = true }
market-simulator = { workspace = true }
performance-metrics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_platform_store"]
