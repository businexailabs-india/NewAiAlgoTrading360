# BusineXAi TradeOS360 — Indian broker / simulated MCP providers
# Live order execution is disabled by default for every provider.
version: "1.0"
country: IN
providers:
  - provider_id: dhan
    provider_name: Dhan / DhanHQ
    provider_type: broker
    country: IN
    enabled: true
    supported_exchanges: [NSE, BSE, MCX]
    supported_segments: [equity, equity_derivatives, currency, commodity]
    supported_asset_classes: [stocks, futures, options, commodities]
    capabilities:
      - account_profile
      - margins
      - holdings
      - positions
      - orders
      - trades
      - live_quotes
      - market_feed
      - historical_data
      - option_chain
      - order_preview
      - live_order_execution
    auth_type: [api_key, access_token]
    credentials_required: [client_id, access_token, api_key_optional]
    live_trading_default: false
    paper_trading_default: false
    status: active
    documentation_url: https://dhanhq.co/docs/v2/
    adapter_class: mcp_connectors.india.dhan.DhanMCPProvider
    env_enable_flag: MCP_ENABLE_DHAN

