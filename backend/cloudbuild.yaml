# Cloud Build configuration for automated deployments
# This file is used by Google Cloud Build to build and deploy the backend

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/smarttrade-backend:$COMMIT_SHA', '.']
    id: 'build-image'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/smarttrade-backend:$COMMIT_SHA']
    id: 'push-image'
    waitFor: ['build-image']

  # Step 3: Run Prisma migrations
  - name: 'gcr.io/$PROJECT_ID/smarttrade-backend:$COMMIT_SHA'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'npx prisma migrate deploy || echo "Migration skipped or failed"'
    env:
      - 'DATABASE_URL=postgresql://smarttrade_user:SmartTrade2024!SecurePass@34.45.48.255:5432/smarttrade?sslmode=require'
    id: 'run-migrations'
    waitFor: ['push-image']

  # Step 4: Deploy to Cloud Run with Cloud SQL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'smarttrade-backend'
      - '--image=gcr.io/$PROJECT_ID/smarttrade-backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:free-trial-first-project'
      - '--set-env-vars=NODE_ENV=production,DATABASE_URL=postgresql://smarttrade_user:SmartTrade2024!SecurePass@localhost/smarttrade?host=/cloudsql/$PROJECT_ID:us-central1:free-trial-first-project,JWT_SECRET=SmartTrade2024JWTSecretKey32Chars,REFRESH_TOKEN_SECRET=SmartTrade2024RefreshSecret32Ch'
    id: 'deploy-cloud-run'
    waitFor: ['run-migrations']

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/smarttrade-backend:$COMMIT_SHA'

# Build timeout
timeout: '1200s'

# Options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'
