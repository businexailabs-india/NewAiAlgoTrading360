version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smarttrade-postgres
    environment:
      POSTGRES_USER: smarttrade
      POSTGRES_PASSWORD: smarttrade_password
      POSTGRES_DB: smarttrade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smarttrade-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Python ML sidecar (scikit-learn + semantic RAG)
  ml-service:
    build: ./ml-service
    container_name: smarttrade-ml
    ports:
      - "8081:8081"
    volumes:
      - ml_models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # LLM service (LoRA/QLoRA — CPU demo; use GPU host in production)
  llm-service:
    build: ./llm-service
    container_name: smarttrade-llm
    ports:
      - "8082:8082"
    volumes:
      - llm_adapters:/app/adapters
    environment:
      LLM_BASE_MODEL: sshleifer/tiny-gpt2
      LLM_ADAPTER_DIR: /app/adapters
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Optional local LLM (Ollama) — run: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    container_name: smarttrade-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Backend API
  backend:
    build: .
    container_name: smarttrade-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://smarttrade:smarttrade_password@postgres:5432/smarttrade
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8081
      LLM_SERVICE_URL: http://llm-service:8082
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      USE_PYTHON_ML: "true"
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET}
      UPSTOX_API_KEY: ${UPSTOX_API_KEY}
      UPSTOX_API_SECRET: ${UPSTOX_API_SECRET}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ml_models:
  llm_adapters:
  ollama_data:
