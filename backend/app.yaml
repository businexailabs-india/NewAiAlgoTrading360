# Google Cloud App Engine Configuration
runtime: nodejs18
env: standard
instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.65

# Environment variables (add your actual values)
env_variables:
  NODE_ENV: "production"
  PORT: "8080"
  SUPABASE_URL: "https://dfzrjfrplludgnycfqbj.supabase.co"
  # Add other env vars in GCP Console for security
  # Don't commit sensitive keys here

handlers:
- url: /.*
  script: auto
  secure: always
